; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
#default_envs = m5stack_atomS3
#default_envs = m5stack_atomLite
#default_envs = m5stack_atomS3

[env]
platform_packages =
	tool-cppcheck @ 1.260.0
check_tool = cppcheck
check_flags = --enable=all
monitor_speed = 115200
#build_type = release
build_type = debug
#build_unflags =
#	-Os
build_flags =
	-D CORE_DEBUG_LEVEL=4
	-D DEBUG_TRACE=1
#	-D CORE_DEBUG_LEVEL=-1
#	-O2

[env:U094_m5stack_atomS3]
# Isolated RS485 Unit / U094
# https://shop.m5stack.com/products/isolated-rs485-unit
platform = espressif32
board = m5stack-atoms3
framework = arduino
lib_deps =
	m5stack/M5AtomS3 @ ^1.0.0
	fastled/FastLED @ ^3.7.0
	m5stack/M5Unified @ ^0.1.16
build_flags =
	${env.build_flags}
	-D DEVICE_NAME=DEVICE_M5AtomS3
	-D RX1=G1
	-D TX1=G2
#upload_port = COM3
#monitor_port = COM3

[env:U094_m5stack_atomLite]
# Isolated RS485 Unit / U094
# https://shop.m5stack.com/products/isolated-rs485-unit
platform = espressif32
board = m5stack-atom
framework = arduino
lib_deps =
	m5stack/M5Atom @ ^0.1.0
	fastled/FastLED @ ^3.7.0
build_flags =
	${env.build_flags}
	-D DEVICE_NAME=DEVICE_M5AtomLite
	-D TX1=G26
	-D RX1=G32
#upload_port = COM23
#monitor_port = COM23

[env:A131_m5stack_atomLite]
# ATOMIC RS485 Base / A131
# https://shop.m5stack.com/products/atomic-rs485-base
platform = espressif32
board = m5stack-atom
framework = arduino
lib_deps =
	m5stack/M5Atom @ ^0.1.0
	fastled/FastLED @ ^3.7.0
build_flags =
	${env.build_flags}
	-D DEVICE_NAME=DEVICE_M5AtomLite
	-D TX1=G19
	-D RX1=G22
#upload_port = COM7
#monitor_port = COM7
